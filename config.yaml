# Параметры исследования композитов баланса (TPO, Dalton).
# Все пороги из SPEC.md живут здесь — код не должен содержать «магических» чисел.

data:
  instruments:
    ES: {file: data/ES_30m_RTH.csv, tick_size: 0.25}
    ES_ETH:                        # та же выгрузка ESZ6, полная сессия Globex (ETH + RTH);
                                   # используется только как бары для тестов зон, профили — по RTH
      file: data/ES_30m_ETH.csv
      tick_size: 0.25
      overrides:                   # накладываются поверх общих параметров (load_config(instrument=...))
        data:
          rth_start: "17:00"       # сессия 17:00–16:00 CT, дата — по дню закрытия
          rth_end: "16:00"
          expected_periods_per_day: 46
          min_periods_full_day: 46
        roll:
          min_volume_ratio: 1.3      # ночной объём размывает скачок: 2026-03-17 даёт 1.34
  source_timezone: Europe/Berlin   # таймзона timestamp в выгрузке (15:30 = 09:30 ET)
  timezone: America/Chicago        # во что переводим для расчётов
  timestamp_is_bar_start: true     # timestamp = начало 30-минутного бара
  rth_start: "08:30"
  rth_end: "15:00"
  expected_periods_per_day: 13     # 08:30–15:00 = 13 TPO-периодов
  min_periods_full_day: 13         # дни короче — "short day", исключаются из классификации типов дня
  continuous_contract: unadjusted  # выгрузка ESZ6 без склейки -> back-adjust по секции roll

roll:
  rule: tuesday_before_third_friday   # день, когда выгрузка переходит на новый контракт
  switch_time_ct: "15:00"             # переход — в понедельник накануне в 15:00 CT (виден по гэпу в ETH)
  min_volume_ratio: 1.4               # проверка: объём в день ролла / объём накануне
  days_to_next_expiry: 91
  # Ожидаемая ставка ФРС на квартал после ролла, % (по ролловерам Mar/Jun/Sep/Dec).
  # 2026 — допущение, поправьте при необходимости.
  policy_rate_pct:
    2021: [0.08, 0.08, 0.08, 0.08]
    2022: [0.60, 2.00, 3.50, 4.40]
    2023: [4.80, 5.15, 5.33, 5.33]
    2024: [5.33, 5.33, 4.90, 4.40]
    2025: [4.33, 4.33, 4.10, 3.65]
    2026: [3.60, 3.60, 3.60, 3.60]
  dividend_yield_pct: {2021: 1.40, 2022: 1.60, 2023: 1.60, 2024: 1.35, 2025: 1.25, 2026: 1.15}
  overrides: {}                       # точный спред из платформы: {"2026-09-15": 46.75}

tpo:
  period_minutes: 30
  ib_periods: 2                    # IB = A + B
  value_area_pct: 0.70
  va_expansion: dalton_two_rows    # расширение VA от POC по 2 уровня
  price_row_ticks: 1               # шаг строки профиля в тиках
  tail_min_rows: 2                 # хвост = ≥2 single prints на краю

balance:
  # close_in_range: день добавляется, пока его close внутри High–Low композита;
  # закрытие вне диапазона завершает композит. va_overlap — прежнее правило ниже.
  method: close_in_range
  min_days: 3
  va_overlap_min: 0.30             # доля VA нового дня, лежащая внутри VA текущего композита
  end_rules:                       # баланс закрывается по первому сработавшему правилу
    - va_overlap_below_min
    - acceptance_beyond_composite_extreme   # принятие за High/Low композита (см. acceptance)
  include_end_day_in_composite: false

zones:
  levels: [VAH, VAL, POC]
  min_composite_days: 3            # зоны берутся из композитов не короче N дней
  lifetime: unlimited              # зоны живут бессрочно; статус virgin/tested ведётся отдельно
  available_from: day_after_balance_end   # защита от look-ahead
  merge_within_ticks: 0            # 0 = не объединять близкие уровни разных композитов

interaction:
  touch_tolerance_ticks: 2
  acceptance:
    # poc_close: только входы в композит (VAH сверху, VAL снизу); принятие = close дня
    #            в POC (± poc_tolerance_ticks) или за POC от стороны входа.
    # periods:   принятие = periods_beyond подряд периодов целиком за уровнем.
    mode: poc_close
    poc_tolerance_ticks: 2
    periods_beyond: 2              # TPO-периодов полностью за уровнем
    consecutive: true
  # отказ = касание без выполнения условия принятия
  approach_by: open                # сторона подхода = open дня относительно уровня
  exclude_breakout_day: true       # не считать в статистике касания в день, закрывший баланс
  opposite_boundary_horizon_days: [0, 1, 3]   # 0 = тот же день

intraday:                          # этап 6: реакция на зоны по 30m барам с флипом
  levels: [VAH, VAL, POC, HVN]
  hvn_share: 0.70                  # HVN-полоса: строки вокруг POC с TPO ≥ 70% от максимума
  reaction_bars_after: 2           # реакция меряется до конца теста + 2 бара
  placebo_min_dist_ticks: 8        # фальш-зона не ближе 8 тиков к любому реальному VAH/VAL/POC

hvn_zones:                         # зоны из дневных HVN (scripts/hvn_zones.py)
  min_tpo: 8                       # берём дни, где HVN в VA = 8..10 TPO в строке
  max_tpo: 10
  # зона дня = HVN-полоса вокруг POC (строки ≥ intraday.hvn_share × максимум)
  merge_overlap_min: 0.50          # доля пересечения от более узкой зоны
  merge_max_width_points: 10.0     # склейка только если итоговая зона ≤ 10 п.
  # зона доступна со следующего дня после дня, в котором она построена

primary_zones:                     # первородные зоны (scripts/primary_zones.py), пороги — из hvn_zones
  placebo_runs: 20
  placebo_shift_widths: [1.5, 3.0] # сдвиг фальш-зоны: U(1.5, 3) × ширина зоны, вверх или вниз
  placebo_min_shift_points: 4.0    # ширина для сдвига не меньше 4 п.
  placebo_runs_30m: 10             # прогонов фальш-зон для 30m-тестов (они медленнее)
  clean_day:                       # «чистый» зачётный день
    poc_pos_range: [0.25, 0.75]    # POC в средней половине VA: (POC − VAL) / (VAH − VAL)
    late_from_period: 9            # поздние периоды: J–M (с 9-го, счёт с 0)
    late_share_max: 0.50           # доля TPO HVN-полосы от поздних периодов не больше 50%

wicks:                             # хвосты 30m-свечей у первородных зон (scripts/zone_wicks.py)
  min_wick_ticks: 2                # хвост короче 2 тиков не считается
  placebo_runs: 10
  class_rejection_share: 0.60      # вариант классов «по отторжениям»: ≥ 60% отторжений в одну сторону

day_type:
  avg_range_lookback_days: 20
  # Расширение диапазона (RE) засчитывается, если выход за IB > этой доли IB.
  # Меньший выход — «прокол», день считается без RE в эту сторону.
  min_extension_share_of_ib: 0.15
  non_trend_range_vs_avg_max: 0.60   # без RE и range < 0.6 × средний range за 20 дней
  # без RE и не Non-trend → Normal
  trend_range_vs_ib_min: 2.0         # trend: range > 2 × IB ...
  trend_close_extreme_share: 0.15    # ... и close в крайних 15% по направлению RE
  trend_min_va_share_of_range: 0.45  # ... и профиль вытянутый: VA ≥ 45% диапазона
  trend_max_tpo_per_row: 9           # ... и нет «пуза»: max TPO в строке ≤ 9
  double_distribution:               # внутренний тонкий разрыв (LVN) между двумя распределениями
    gap_max_tpo_per_row: 2           # строки разрыва: TPO ≤ 2
    min_single_print_gap_ticks: 4
    min_gap_share_of_range: 0.10
  neutral:
    center_close_band: [0.25, 0.75]  # close внутри → Neutral Center, иначе Neutral Extreme

profile_shape:
  # P: POC в верхней трети и центр масс TPO ≥ 0.55 диапазона (b — зеркально)
  p_b_mass_center_min: 0.55
  thin_max_tpo_per_row: 3          # вытянутый «trend»-профиль

stats:
  min_events_per_cell: 30          # меньше — помечать ячейку как ненадёжную
  baseline: [all_days, placebo_zones]
  placebo:                         # фальш-зоны: уровни композита сдвинуты на ±U(lo, hi) ширин VA
    runs: 20
    shift_va_widths: [1.0, 3.0]
    min_va_width_ticks: 8
    seed: 0
  sensitivity:                     # пересчёт ключевых цифр при других порогах
    zones.min_composite_days: [3, 5]
    interaction.touch_tolerance_ticks: [0, 2, 4]
    interaction.acceptance.poc_tolerance_ticks: [0, 2, 8]
  split_by: [instrument, year]
  holdout_from: "2024-01-01"       # калибровка до даты, проверка после
